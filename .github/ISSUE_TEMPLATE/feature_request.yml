name: 功能请求 / Feature Request
description: 提议一个想法或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好点子欢迎提！请说明你想要什么、为什么需要。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在有什么痛点？这个功能能帮上什么？
      placeholder: 例如：现在只能导入到已有文件夹，希望能自动创建文件夹
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你设想怎么实现？（可选，有代码草稿更好）
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有别的做法也能达到目的？
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 已搜索现有 issue，确认不是重复提议
          required: true
