name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax check
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile

      - name: Node syntax check
        run: |
          find . \( -name "*.cjs" -o -name "*.js" \) -not -path "./.git/*" -print0 | xargs -0 -n1 node --check

      - name: Secret leak scan
        # 防御：任何真实微信 cookie / 云密钥特征泄漏即失败
        run: |
          if grep -rIin -E "wxuin=|slave_sid=|bizuin=|AKID[A-Za-z0-9]{10,}|token=15[0-9]{8}" . --exclude-dir=.git; then
            echo "::error::检测到疑似私人凭证泄漏，已阻止。请检查改动。"
            exit 1
          fi
          echo "secret scan passed"
