name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax check
        run: |
          find . -name "*.py" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m py_compile

      - name: Node syntax check
        run: |
          find . \( -name "*.cjs" -o -name "*.js" \) -not -path "./.git/*" -print0 | xargs -0 -n1 node --check

      - name: Secret leak scan
        # 防御：检查实际代码目录是否误提交真实微信凭证 / 云密钥
        # 只扫描 wechat-to-ima/ 与 ima-skill/，避免把 CI 文件和文档里的示例 grep 命令误当成泄露
        run: |
          if grep -rIin -E "wxuin=|slave_sid=|bizuin=|AKID[A-Za-z0-9]{10,}|token=15[0-9]{8}" wechat-to-ima ima-skill; then
            echo "::error::检测到疑似私人凭证泄漏，已阻止。请检查改动。"
            exit 1
          fi
          echo "secret scan passed"
