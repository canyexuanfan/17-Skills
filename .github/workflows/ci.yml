name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gzh-to-ima:
    runs-on: ubuntu-latest
    # 仅当 01 号 skill 有改动时运行
    if: ${{ !contains(github.event.head_commit.message, 'ci-skip') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python syntax check
        run: |
          find skills/gzh-to-ima -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Node syntax check
        run: |
          find skills/gzh-to-ima \( -name "*.cjs" -o -name "*.js" \) -print0 | xargs -0 -n1 node --check

      - name: Secret leak scan
        # 防御：检查实际代码目录是否误提交真实微信凭证 / 云密钥
        # 只扫描代码目录，避免把 CI 文件和文档里的示例 grep 命令误当成泄露
        run: |
          if grep -rIin -E "wxuin=|slave_sid=|bizuin=|AKID[A-Za-z0-9]{10,}|token=15[0-9]{8}" \
            skills/gzh-to-ima/wechat-to-ima skills/gzh-to-ima/ima-skill; then
            echo "::error::检测到疑似私人凭证泄漏，已阻止。请检查改动。"
            exit 1
          fi
          echo "secret scan passed"

  breakout-cli-login:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci-skip') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          python -m py_compile skills/breakout-cli-login/login.py

      - name: Shell syntax check
        run: |
          bash -n skills/breakout-cli-login/setup.sh

  image-skills-syntax:
    # image-copyright-watermark 与 image-to-prompt：纯语法 + 凭证泄漏检查
    # （重型单测依赖 blind-watermark/opencv 等，由各 skill 本地验证，不在 CI 安装）
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci-skip') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          find skills/image-copyright-watermark skills/image-to-prompt -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Secret leak scan
        run: |
          if grep -rIin -E "wxuin=|slave_sid=|bizuin=|AKID[A-Za-z0-9]{10,}|token=15[0-9]{8}|api[_-]?key['\"]?\s*[:=]\s*['\"][A-Za-z0-9_-]{16,}" \
            skills/image-copyright-watermark skills/image-to-prompt; then
            echo "::error::检测到疑似凭证泄漏，已阻止。请检查改动。"
            exit 1
          fi
          echo "secret scan passed"

  xweb-syntax:
    # xweb：Python 语法 + shell 语法 + 凭证泄漏检查（原生签名二进制不参与 CI 检查）
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci-skip') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          find skills/xweb/xweb -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Shell syntax check
        run: |
          bash -n skills/xweb/install.sh skills/xweb/bin/xweb

      - name: Secret leak scan
        run: |
          if grep -rIin -E "wxuin=|slave_sid=|bizuin=|AKID[A-Za-z0-9]{10,}|token=15[0-9]{8}|api[_-]?key['\"]?\s*[:=]\s*['\"][A-Za-z0-9_-]{16,}" \
            skills/xweb --include="*.py" --include="*.json"; then
            echo "::error::检测到疑似凭证泄漏，已阻止。请检查改动。"
            exit 1
          fi
          echo "secret scan passed"

  rweb-syntax:
    # rweb：Python 语法 + shell 语法 + 凭证泄漏检查（原生核心二进制不参与 CI 检查）
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci-skip') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python syntax check
        run: |
          find skills/rweb/rweb -name "*.py" -print0 | xargs -0 -n1 python -m py_compile

      - name: Shell syntax check
        run: |
          bash -n skills/rweb/install.sh skills/rweb/bin/rweb

      - name: Secret leak scan
        run: |
          if grep -rIin -E "wxuin=|slave_sid=|bizuin=|AKID[A-Za-z0-9]{10,}|token=15[0-9]{8}|api[_-]?key['\"]?\s*[:=]\s*['\"][A-Za-z0-9_-]{16,}" \
            skills/rweb --include="*.py" --include="*.json"; then
            echo "::error::检测到疑似凭证泄漏，已阻止。请检查改动。"
            exit 1
          fi
          echo "secret scan passed"
