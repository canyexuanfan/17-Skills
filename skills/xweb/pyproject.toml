[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xweb"
version = "1.3.2"
description = "X (x.com) 命令行客户端 —— 不用浏览器、不用 API key：访客态读公开数据，填自己的登录态解锁全站读能力"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["twitter", "x", "cli", "scraper", "graphql", "command-line"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["curl_cffi>=0.7"]

[project.urls]
Homepage = "https://github.com/canyexuanfan/17-Skills/tree/main/skills/xweb"

[project.scripts]
xweb = "xweb.cli:main"

[tool.setuptools]
packages = ["xweb", "xweb.xclid"]

[tool.setuptools.package-data]
xweb = ["data/*.json"]
"xweb.xclid" = ["bin/*/*"]
