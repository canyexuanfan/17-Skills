name: Bug 报告 / Bug Report
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填完整，方便我们快速定位问题。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象描述
      description: 发生了什么？和你的预期有什么不同？
      placeholder: 例如：运行 fetch_articles.py 后只抓到 0 篇，且报错 ret=200013
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步怎么操作能稳定触发这个问题？
      placeholder: |
        1. 配置 weixin_credentials.py
        2. 运行 `python fetch_articles.py --url ...`
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你本来期望发生什么？
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统 / Python 版本 / Node 版本
      placeholder: "Windows 11 / Python 3.13 / Node 22"
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 自查
      options:
        - label: 已确认 weixin_credentials.py 未被提交（不含真实 token/cookie）
          required: true
        - label: 已阅读频控警告（ret=200013/200003 会封 IP）
          required: true
